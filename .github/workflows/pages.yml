# Deploys the static web app (web/) to GitHub Pages.
# Enable once in the repository: Settings -> Pages -> Source: "GitHub Actions".
# Everything runs in the visitor's browser; the OpenRouter key is entered by each
# player and kept in their own browser (localStorage). No secrets are used here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the JavaScript translation from the ZIL source
        run: npm run build
      - name: Verify against the original game
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
