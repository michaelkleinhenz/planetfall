<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Planetfall AI</title>
  <meta name="description" content="Infocom classics (Planetfall, Zork I) translated from their original source to JavaScript, with an AI command interpreter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='18' fill='%23e8a33d'/%3E%3Cellipse cx='32' cy='36' rx='29' ry='7' fill='none' stroke='%237fd1c7' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" id="home" data-i18n-title="menuBack" title="All games">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="34" r="17" class="logo-planet"/>
        <ellipse cx="32" cy="34" rx="28" ry="7" class="logo-ring"/>
      </svg>
      <span class="title" id="game-title">PLANETFALL AI</span>
    </a>
    <div class="status" aria-live="polite">
      <span id="status-room" class="status-room">—</span>
      <span class="status-sep">·</span>
      <span><span data-i18n="score">Score</span> <b id="status-score">0</b></span>
      <span class="status-sep">·</span>
      <span><span id="status-second-label" data-i18n="time">Time</span> <b id="status-time">0</b></span>
    </div>
    <nav class="actions">
      <button id="btn-hint" class="icon-btn" title="Hint" aria-label="Hint" data-keep-focus data-i18n-title="hintTitle" data-i18n-aria="hintTitle">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
      </button>
      <button id="btn-undo" class="icon-btn" data-keep-focus title="Undo last turn (Ctrl+Z)" aria-label="Undo" data-i18n-title="undoTitle" data-i18n-aria="undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="btn-save" class="icon-btn" title="Save game" aria-label="Save" data-i18n-title="saveTitle" data-i18n-aria="save">
        <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></svg>
      </button>
      <button id="btn-load" class="icon-btn" title="Restore a saved game" aria-label="Restore" data-i18n-title="loadTitle" data-i18n-aria="load">
        <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v11H3z"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings" data-i18n-title="settingsTitle" data-i18n-aria="settingsTitle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </nav>
  </header>

  <main id="menu" class="menu" hidden>
    <section class="menu-hero">
      <h1 data-i18n="menuTitle"></h1>
      <p data-i18n="menuIntro"></p>
    </section>
    <h2 class="menu-h" data-i18n="menuGames"></h2>
    <div id="game-cards" class="game-cards"></div>
    <section class="menu-data">
      <h2 class="menu-h" data-i18n="dataTitle"></h2>
      <p class="muted" data-i18n="dataText"></p>
      <label class="check small-check"><input id="backup-key" type="checkbox"> <span data-i18n="dataIncludeKey"></span></label>
      <div class="menu-data-actions">
        <button id="backup" class="btn primary" type="button" data-i18n="dataBackup"></button>
        <button id="restore" class="btn ghost" type="button" data-i18n="dataRestore"></button>
        <button id="menu-settings" class="btn ghost" type="button" data-i18n="menuSettings"></button>
        <input id="restore-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="data-status" class="muted small" role="status"></p>
    </section>
  </main>

  <main id="transcript" class="transcript" aria-live="polite"></main>

  <footer class="inputbar" id="inputbar">
    <button id="more" class="more-btn" type="button" hidden data-keep-focus data-i18n-title="moreTitle">
      <span data-i18n="more">More</span>
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="actions" class="actionbar" role="toolbar" data-i18n-aria="actionsLabel"></div>
    <form id="command-form" autocomplete="off">
      <span id="mode-badge" class="mode-badge" title="Interpreter mode" data-i18n-title="modeTitle">CLASSIC</span>
      <input id="command" type="text" spellcheck="false" autocapitalize="off"
             placeholder="What do you want to do?" aria-label="Your command" data-i18n-aria="commandLabel" disabled>
      <button id="send" type="submit" class="send-btn" aria-label="Send" data-i18n-aria="send" data-keep-focus disabled>
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </form>
    <p id="hint" class="hint"></p>
  </footer>

  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" id="settings-form">
      <h2 data-i18n="settingsHeading">Settings</h2>
      <label class="field">
        <span data-i18n="languageLabel">Language</span>
        <select id="set-lang">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
      <p class="muted small" data-i18n="languageHelp"></p>
      <h3 class="subheading" data-i18n="aiHeading">AI interpreter</h3>
      <p class="muted" data-i18n-html="aiIntro"></p>
      <label class="field">
        <span data-i18n="keyLabel">OpenRouter API key</span>
        <input id="set-key" type="password" placeholder="sk-or-…" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="modelLabel">Model</span>
        <input id="set-model" type="text" list="model-list" spellcheck="false" data-i18n-placeholder="modelPlaceholder">
        <datalist id="model-list"></datalist>
      </label>
      <label class="check"><input id="set-ai" type="checkbox"> <span data-i18n="useAi">Use the AI interpreter</span></label>
      <label class="check"><input id="set-show" type="checkbox"> <span data-i18n="showCommands">Show the commands the AI sends to the game</span></label>
      <p class="muted small" data-i18n-html="privacy"></p>
      <div class="dialog-actions">
        <button type="button" value="cancel" class="btn ghost" data-close data-i18n="cancel">Cancel</button>
        <button value="ok" id="settings-ok" class="btn primary" data-i18n="saveSettings">Save settings</button>
      </div>
    </form>
  </dialog>

  <dialog id="slots-dialog" class="dialog">
    <form method="dialog" id="slots-form">
      <h2 id="slots-title">Save game</h2>
      <div id="slots-list" class="slots"></div>
      <label class="field" id="slot-name-field">
        <span data-i18n="saveName">Save name</span>
        <input id="slot-name" type="text" maxlength="40" data-i18n-placeholder="saveNamePlaceholder">
      </label>
      <div class="dialog-actions">
        <button type="button" value="cancel" class="btn ghost" data-close data-i18n="cancel">Cancel</button>
        <button value="ok" id="slots-ok" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
