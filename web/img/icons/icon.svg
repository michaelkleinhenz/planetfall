<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1d2547"/><stop offset=".55" stop-color="#0b0f22"/><stop offset="1" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="planet" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe7a8"/><stop offset=".35" stop-color="#f2a94e"/><stop offset=".75" stop-color="#b5521a"/><stop offset="1" stop-color="#5a1f08"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#6fd8c8" stop-opacity=".15"/><stop offset=".35" stop-color="#8ff0e2"/><stop offset=".65" stop-color="#6fd8c8"/><stop offset="1" stop-color="#6fd8c8" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="front"><rect x="0" y="262" width="512" height="250"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="96" cy="112" r="3.2" opacity=".9"/><circle cx="410" cy="88" r="2.6" opacity=".7"/>
    <circle cx="440" cy="300" r="2.2" opacity=".6"/><circle cx="70" cy="360" r="2.4" opacity=".6"/>
    <circle cx="150" cy="440" r="1.8" opacity=".5"/><circle cx="360" cy="430" r="2.8" opacity=".75"/>
    <path d="M404 170l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".85"/>
  </g>
  <circle cx="256" cy="262" r="118" fill="#f2a94e" opacity=".45" filter="url(#glow)"/>
  <!-- ring behind, planet, ring in front -->
  <ellipse cx="256" cy="262" rx="200" ry="52" transform="rotate(-14 256 262)" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".55"/>
  <circle cx="256" cy="262" r="112" fill="url(#planet)"/>
  <g clip-path="url(#front)">
    <ellipse cx="256" cy="262" rx="200" ry="52" transform="rotate(-14 256 262)" fill="none" stroke="url(#ring)" stroke-width="16"/>
  </g>
</svg>
